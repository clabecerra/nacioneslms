<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario LMS Naciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Oswald:wght@500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-fondo:#8FA1C1;
    --azul-marino:#18375D;
    --azul-claro:#93A4C4;
    --dorado:#E9A83C;
    --blanco:#ffffff;
    --linea:#C9D2E2;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:#5f6f8d;
    font-family:'Jost',system-ui,sans-serif;
    display:flex;
    justify-content:center;
    padding:24px 12px;
    -webkit-font-smoothing:antialiased;
  }

  .afiche{
    width:100%;
    max-width:1130px;
    background:var(--azul-fondo);
    padding:36px 34px 34px;
  }

  /* ---------- Encabezado ---------- */
  .cabecera{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:26px;
    min-height:120px;
  }
  .logo{
    flex:0 0 auto;
    width:33%;
    max-width:330px;
  }
  .logo svg{display:block;width:100%;height:auto}

  .logo-pendiente{
    border:2px dashed rgba(255,255,255,.55);
    border-radius:6px;
    min-height:112px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--blanco);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:.14em;
    line-height:1.7;
    padding:12px;
    opacity:.85;
  }

  .mes{
    font-family:'Yellowtail',cursive;
    font-size:clamp(48px,8.6vw,104px);
    color:var(--azul-marino);
    line-height:.9;
    padding-right:6px;
  }

  /* ---------- Grilla ---------- */
  .grilla{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    background:var(--linea);
    gap:1px;
    border:1px solid var(--linea);
  }
  .dia-semana{
    background:var(--azul-marino);
    color:var(--blanco);
    text-align:center;
    padding:26px 0;
    font-size:24px;
    font-weight:300;
    letter-spacing:.06em;
  }
  .celda{
    background:var(--blanco);
    min-width:0;
    overflow:hidden;
    min-height:132px;
    padding:10px 11px 12px;
    display:flex;
    flex-direction:column;
  }
  .celda.vacia{background:var(--blanco)}

  .numero{
    text-align:right;
    font-size:23px;
    font-weight:300;
    color:#2b2b2b;
    line-height:1;
  }

  .eventos{
    margin-top:auto;
    min-width:0;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:5px;
    align-items:flex-end;
    text-align:right;
  }

  .evento{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:11px;
    line-height:1.25;
    letter-spacing:.02em;
    text-transform:uppercase;
    overflow-wrap:normal;
    word-break:keep-all;
    hyphens:none;
  }
  .evento.entrenamiento{color:var(--azul-marino)}
  .evento.extra,.evento.almuerzo{color:var(--azul-claro);font-size:11px;font-weight:500}
  .evento.efemeride{color:var(--azul-claro);font-size:9px;font-weight:500}
  .evento.partido{color:var(--dorado);font-size:11.5px;font-weight:700}

  .fila-partido{
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    gap:6px;
    width:100%;
  }
  .fila-partido .evento{white-space:nowrap;overflow-wrap:normal}
  .icono{
    flex:0 0 auto;
    width:44px;
    height:51px;
    color:var(--dorado);
  }
  .icono svg{display:block;width:100%;height:100%}

  /* ---------- Cajas inferiores ---------- */
  .cajas{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:26px;
    margin-top:26px;
  }
  .caja{
    background:var(--blanco);
    padding:22px 24px 26px;
    min-height:150px;
  }
  .caja h2{
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:19px;
    letter-spacing:.22em;
    color:#3d3d3d;
    margin-bottom:14px;
  }
  .caja p{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    line-height:1.65;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .caja.notas p{color:var(--dorado)}
  .caja.cumples p{color:var(--azul-marino)}

  /* ---------- Navegación ---------- */
  .nav{
    max-width:1130px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }
  .nav button{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    background:var(--blanco);
    color:var(--azul-marino);
    border:none;
    border-radius:4px;
    padding:9px 18px;
    cursor:pointer;
  }
  .nav button:hover{background:#e8edf6}
  .nav button:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
  .nav span{
    font-family:'Oswald',sans-serif;
    color:var(--blanco);
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:14px;
    min-width:190px;
    text-align:center;
  }

  .envoltorio{display:flex;flex-direction:column;align-items:center;width:100%}

  .estado{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--blanco);
    background:rgba(0,0,0,.22);
    border-radius:4px;
    padding:7px 14px;
    margin-bottom:14px;
    max-width:1130px;
    text-align:center;
  }
  .estado.ok{background:rgba(30,110,60,.55)}
  .estado.falla{background:rgba(150,45,45,.6)}

  /* ---------- Responsive ---------- */
  @media (max-width:820px){
    .afiche{padding:20px 16px}
    .cabecera{min-height:0}
    .dia-semana{font-size:15px;padding:14px 0}
    .celda{min-height:88px;padding:6px 6px 8px}
    .numero{font-size:15px}
    .evento{font-size:7px;letter-spacing:0;line-height:1.2}
    .evento.partido{font-size:7px}
    .evento.extra,.evento.almuerzo{font-size:7px}
    .evento.efemeride{font-size:6px}
    .icono{width:15px;height:17px}
    .fila-partido{gap:2px}
    .fila-partido .evento{white-space:nowrap}
    .nav span{min-width:0;font-size:12px}
    .nav button{font-size:11px;padding:7px 12px}
    .cajas{grid-template-columns:1fr;gap:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    <button id="anterior" type="button">← Mes anterior</button>
    <span id="etiqueta-mes"></span>
    <button id="siguiente" type="button">Mes siguiente →</button>
  </nav>

    const nombre = "respuestaLMS" + Date.now();
    const etiqueta = document.createElement("script");

    const limpiar = () => {
      delete window[nombre];
      etiqueta.remove();
    };

    const plazo = setTimeout(() => {
      limpiar();
      reject(new Error("El script no respondió a tiempo."));
    }, 12000);

    window[nombre] = datos => {
      clearTimeout(plazo);
      limpiar();
      resolve(datos);
    };

    etiqueta.onerror = () => {
      clearTimeout(plazo);
      limpiar();
      reject(new Error("No se pudo cargar la respuesta del script."));
    };

    etiqueta.src = url + "&callback=" + nombre;
    document.head.appendChild(etiqueta);
  });
}

function avisar(texto, clase){
  const el = document.getElementById("estado");
  if (!el) return;
  el.textContent = texto;
  el.className = "estado " + (clase || "");
}

async function obtenerMes(a, m){
  const k = clave(a, m);
  if (cache[k]) return cache[k];

  if (URL_SCRIPT){
    const url = URL_SCRIPT + "?anio=" + a + "&mes=" + (m + 1);
    let datos = null;

    try {
      const respuesta = await fetch(url);
      datos = await respuesta.json();
    } catch (e) {
      // Bloqueo por CORS (típico al abrir el archivo con doble clic).
      // Se reintenta por JSONP, que no pasa por esa restricción.
      try {
        datos = await porJsonp(url);
      } catch (e2) {
        ultimoFallo = e2.message;
        console.warn("No se pudo consultar Google Calendar:", e2);
      }
    }

    if (datos && !datos.error){
      avisar("Leyendo de Google Calendar", "ok");
      cache[k] = datos;
      return datos;
    }
    if (datos && datos.error){
      avisar("El script respondió: " + datos.error, "falla");
      console.warn("El script respondió con un error:", datos.error);
    } else {
      avisar("No se pudo conectar (" + (ultimoFallo || "motivo desconocido") +
             "). Mostrando datos de ejemplo.", "falla");
    }
  } else {
    avisar("URL_SCRIPT está vacía. Mostrando datos de ejemplo.", "falla");
  }

  const local = RESPALDO[k] || { eventos: [], notas: [], cumpleanos: [] };
  cache[k] = local;
  return local;
}

async function dibujar(){
  if (cargando) return;
  cargando = true;

  document.getElementById("nombre-mes").textContent = MESES[mesActual];
  document.getElementById("etiqueta-mes").textContent = MESES[mesActual] + " " + anioActual;

  const datos = await obtenerMes(anioActual, mesActual);

  const porDia = {};
  (datos.eventos || []).forEach(ev => {
    (porDia[ev.dia] = porDia[ev.dia] || []).push(ev);
  });
  Object.values(porDia).forEach(lista =>
    lista.sort((x, y) => (PESO[x.tipo] ?? 2) - (PESO[y.tipo] ?? 2)));

  const grilla = document.getElementById("grilla");
  grilla.innerHTML = "";

  CABECERAS.forEach(letra => {
    const c = document.createElement("div");
    c.className = "dia-semana";
    c.textContent = letra;
    grilla.appendChild(c);
  });

  // getDay() da 0 para domingo; la grilla parte en lunes.
  const primerDia = new Date(anioActual, mesActual, 1).getDay();
  const desplazamiento = (primerDia + 6) % 7;
  const totalDias = new Date(anioActual, mesActual + 1, 0).getDate();

  for (let i = 0; i < desplazamiento; i++){
    const c = document.createElement("div");
    c.className = "celda vacia";
    grilla.appendChild(c);
  }

  for (let d = 1; d <= totalDias; d++){
    const celda = document.createElement("div");
    celda.className = "celda";

    const num = document.createElement("div");
    num.className = "numero";
    num.textContent = d;
    celda.appendChild(num);

    const cont = document.createElement("div");
    cont.className = "eventos";

    (porDia[d] || []).forEach(ev => {
      const texto = (ev.hora ? escapar(ev.hora) + "<br>" : "") + aHtml(ev.titulo);

      if (ev.tipo === "partido"){
        const fila = document.createElement("div");
        fila.className = "fila-partido";
        const ico = document.createElement("div");
        ico.className = "icono";
        ico.innerHTML = ICONO_PARTIDO;
        const txt = document.createElement("div");
        txt.className = "evento partido";
        txt.innerHTML = texto;
        fila.appendChild(ico);
        fila.appendChild(txt);
        cont.appendChild(fila);
      } else {
        const p = document.createElement("div");
        p.className = "evento " + ev.tipo;
        p.innerHTML = texto;
        cont.appendChild(p);
      }
    });

    celda.appendChild(cont);
    grilla.appendChild(celda);
  }

  // Completar la última fila para que la grilla quede pareja.
  const usadas = desplazamiento + totalDias;
  const faltan = (7 - (usadas % 7)) % 7;
  for (let i = 0; i < faltan; i++){
    const c = document.createElement("div");
    c.className = "celda vacia";
    grilla.appendChild(c);
  }

  document.getElementById("notas").innerHTML =
    (datos.notas || []).map(n => "<p>" + aHtml(n) + "</p>").join("");
  document.getElementById("cumples").innerHTML =
    (datos.cumpleanos || []).map(n => "<p>" + aHtml(n) + "</p>").join("");

  cargando = false;
}

document.getElementById("anterior").addEventListener("click", () => {
  mesActual--;
  if (mesActual < 0){ mesActual = 11; anioActual--; }
  dibujar();
});

document.getElementById("siguiente").addEventListener("click", () => {
  mesActual++;
  if (mesActual > 11){ mesActual = 0; anioActual++; }
  dibujar();
});

dibujar();
</script>
</body>
</html>
