<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipo de Naciones</title>
<style>
  :root{
    --ink:#1B3A6B;
    --navy:#1B3A6B;
    --steel:#4A6FA5;
    --paper:#F4F6F9;
    --line:#C8D4E3;
    --muted:#7B9BB8;
    --ok:#3A6B52;
    --ok-bg:#EAF2EC;
    --bad:#A8432F;
    --bad-bg:#F6E9E6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
  #app{max-width:880px;margin:0 auto;padding:24px 16px 48px;}

  .topbar{
    display:flex;align-items:center;flex-wrap:wrap;
    background:var(--navy);
    border-radius:12px;
    padding:12px 20px;
    margin-bottom:20px;
    gap:10px 14px;
  }
  .topbar-badge{
    flex-shrink:0;
    display:flex;
    align-items:center;
  }
  .topbar-badge svg{
    width:76px;
    height:auto;
    display:block;
  }
  .topbar-title{
    flex:1;min-width:0;
    display:flex;align-items:center;justify-content:center;gap:8px;
    color:#fff;opacity:0.92;
  }
  .topbar-title span{
    font-size:15px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .topbar-nav{flex-shrink:0;}
  .topbar-nav button{
    border:1px solid rgba(255,255,255,0.4);
    background:transparent;
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .topbar-nav button:hover{background:rgba(255,255,255,0.1);}

  @media(max-width:400px){
    .topbar{padding:10px 14px;}
    .topbar-badge svg{width:56px;}
    .topbar-title span{font-size:12px;}
    .topbar-nav button{padding:6px 10px;font-size:11.5px;}
  }

  .page-head{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    margin-bottom:20px;
  }
  .page-head h2{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:22px;font-weight:700;margin:0;
  }

  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tabs button{
    padding:8px 16px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;
    color:var(--muted);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tabs button.active{color:var(--ink);border-bottom:2px solid var(--ink);}

  .empty{
    text-align:center;color:var(--muted);padding:40px 0;
    border:1px dashed var(--line);border-radius:12px;background:#fff;
  }
  .empty p{margin:0 0 12px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .tile{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 18px 16px;
    text-decoration:none;color:inherit;
    transition:border-color .12s ease, transform .12s ease;
  }
  .tile:hover{border-color:var(--steel);transform:translateY(-2px);}
  .tile-name{font-size:16px;font-weight:700;margin:0;color:var(--ink);}

  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:hidden;}
  .panel-head{
    padding:12px 16px;border-bottom:1px solid var(--line);
    font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);
  }

  .item-row{
    padding:14px 16px;border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:10px;
  }
  .item-row:last-child{border-bottom:none;}
  .item-row-fields{display:flex;flex-direction:column;gap:8px;}
  .item-row-actions{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .vis-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .empty-row{padding:24px 16px;text-align:center;color:var(--muted);font-size:13.5px;}

  .add-form{padding:16px;display:flex;flex-direction:column;gap:10px;}
  .add-form-footer{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  .vis-hint{font-size:11.5px;color:var(--muted);}

  @media(min-width:640px){
    .item-row{flex-direction:row;align-items:center;}
    .item-row-fields{flex-direction:row;flex:1;}
    .item-row-fields input.item-name{flex:0 0 32%;}
    .item-row-fields input.item-url{flex:1;}
    .item-row-actions{flex:0 0 auto;}
    .add-form{flex-direction:row;flex-wrap:wrap;align-items:center;}
    .add-form input{flex:1;min-width:180px;}
    .add-form-footer{flex:0 0 auto;width:auto;}
  }

  input[type=text],input[type=url]{
    width:100%;padding:9px 10px;font-size:14px;
    border:1px solid var(--line);border-radius:8px;
    background:var(--paper);color:var(--ink);outline:none;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  input[type=text]:focus,input[type=url]:focus{background:#fff;border-color:var(--steel);}
  input.field-error{border-color:var(--bad);background:var(--bad-bg);}

  .btn{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:8px;border:none;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;
  }
  .btn-ink{background:var(--ink);color:#fff;}
  .btn-ink:hover{background:#152f57;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--steel);}
  .btn-text{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}
  .btn-text.danger{color:var(--bad);}

  .switch{position:relative;display:inline-block;width:36px;height:20px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;cursor:pointer;background:var(--line);border-radius:20px;transition:.15s;}
  .slider::before{content:"";position:absolute;height:14px;width:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--ink);}
  .switch input:checked + .slider::before{transform:translateX(16px);}

  .status-msg{font-size:12px;padding:0 16px 12px;min-height:14px;color:var(--muted);}
  .status-msg.ok{color:var(--ok);}
  .status-msg.err{color:var(--bad);}

  .lock-panel{
    text-align:center;color:var(--muted);padding:44px 20px;
    border:1px dashed var(--line);border-radius:12px;background:#fff;
  }
  .lock-icon{margin:0 auto 12px;display:block;color:var(--muted);}
  .lock-panel p{margin:0 0 18px;font-size:13.5px;}
  .lock-link{
    display:inline-flex;align-items:center;gap:5px;
    border:none;background:none;color:var(--muted);cursor:pointer;
    font-size:12px;text-decoration:underline;padding:0;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .login-form{
    display:flex;flex-direction:column;gap:10px;
    max-width:280px;margin:0 auto;text-align:left;
  }
  .login-form label{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:2px;display:block;}
  .login-form input{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    font-size:14px;outline:none;background:var(--paper);color:var(--ink);
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .login-form input:focus{background:#fff;border-color:var(--steel);}
  .login-form input.error{border-color:var(--bad);background:var(--bad-bg);}
  .login-form .btn{width:100%;justify-content:center;margin-top:4px;}
  .login-error{font-size:11.5px;color:var(--bad);margin-top:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ⚠️ Reemplaza estos valores por los de tu proyecto de Firebase
// (Firebase Console → ⚙️ Configuración del proyecto → Tus apps → SDK config)
const firebaseConfig = {
  apiKey: "AIzaSyDONdjN1YwODlBZvBs07R4_ZviDdAWK3c8",
  authDomain: "naciones-lms.firebaseapp.com",
  projectId: "naciones-lms",
  storageBucket: "naciones-lms.firebasestorage.app",
  messagingSenderId: "438759945344",
  appId: "1:438759945344:web:ad65d5a060b836902a2265"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);
// Todos los contenedores viven en un único documento: colección "landing", doc "containers"
const containersRef = doc(db, "landing", "containers");

let view = 'landing';
let items = [];
let loaded = false;
let newRow = { name:'', url:'' };
let statusMsg = '';
let statusType = '';
let addError = '';
let addErrorFields = {};
let isAdmin = false;
let authChecked = false;
let loginEmail = '';
let loginPassword = '';
let loginError = '';
let loginBusy = false;

onAuthStateChanged(auth, (user)=>{
  isAdmin = !!user;
  authChecked = true;
  render();
});

function uid(){ return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function normalizeUrl(u){
  if(!u) return u;
  u = u.trim();
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

async function loadItems(){
  try{
    const snap = await getDoc(containersRef);
    items = (snap.exists() && Array.isArray(snap.data().items)) ? snap.data().items : [];
  }catch(e){
    console.error('Error cargando contenedores:', e);
    items = [];
  }
  loaded = true;
  render();

  // Mantiene la vista al día si otra persona edita desde otro dispositivo
  onSnapshot(containersRef, (snap)=>{
    if(snap.exists() && Array.isArray(snap.data().items)){
      items = snap.data().items;
      render();
    }
  }, (err)=> console.error('Error escuchando cambios:', err));
}

async function persist(){
  try{
    await setDoc(containersRef, { items });
    return true;
  }catch(e){
    console.error('Error guardando:', e);
    return false;
  }
}

function flash(msg, type){
  statusMsg = msg;
  statusType = type;
  render();
  setTimeout(()=>{ statusMsg=''; statusType=''; render(); }, 2200);
}

function switchView(v){
  view = v;
  if(v === 'landing'){
    loginEmail = '';
    loginPassword = '';
    loginError = '';
  }
  render();
}

async function attemptLogin(){
  if(loginBusy) return;
  const email = loginEmail.trim();
  const password = loginPassword;
  if(!email || !password){
    loginError = 'Completa correo y contraseña.';
    render();
    return;
  }
  loginBusy = true;
  loginError = '';
  render();
  try{
    await signInWithEmailAndPassword(auth, email, password);
    loginEmail = '';
    loginPassword = '';
  }catch(e){
    loginError = 'Correo o contraseña incorrectos.';
  }
  loginBusy = false;
  render();
}

async function doLogout(){
  await signOut(auth);
  switchView('landing');
}

async function addItem(){
  const name = newRow.name.trim();
  const url = newRow.url.trim();
  addErrorFields = { name: !name, url: !url };
  if(!name || !url){
    const faltan = [!name && 'nombre', !url && 'URL'].filter(Boolean).join(' y ');
    addError = `Falta ${faltan}. Complétalo para poder agregar el contenedor.`;
    render();
    return;
  }
  addError = '';
  addErrorFields = {};
  items.push({ id: uid(), name, url: normalizeUrl(url), visible: true });
  newRow = { name:'', url:'' };
  const ok = await persist();
  flash(ok ? 'Contenedor agregado.' : 'No se pudo guardar.', ok ? 'ok' : 'err');
}

function updateField(id, field, value){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  it[field] = value;
}

async function commitField(id, field, value){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  if(field === 'url') value = normalizeUrl(value);
  it[field] = value;
  const ok = await persist();
  flash(ok ? 'Cambios guardados.' : 'No se pudo guardar.', ok ? 'ok' : 'err');
}

async function toggleVisible(id){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  it.visible = !it.visible;
  const ok = await persist();
  render();
  flash(ok ? 'Cambios guardados.' : 'No se pudo guardar.', ok ? 'ok' : 'err');
}

async function deleteItem(id){
  items = items.filter(i=>i.id!==id);
  const ok = await persist();
  flash(ok ? 'Contenedor eliminado.' : 'No se pudo guardar.', ok ? 'ok' : 'err');
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

  const app = document.getElementById('app');

  const topbar = `
    <div class="topbar">

      <div class="topbar-title"><span>Equipo de Naciones</span></div>
      <div class="topbar-nav">
        ${view === 'admin'
          ? `<button data-nav="landing">Ver landing</button>`
          : ''}
      </div>
    </div>`;

  let body = '';
  if(!loaded){
    body = `<div class="empty"><p>Cargando…</p></div>`;
  } else if(view === 'landing'){
    body = renderLanding();
  } else {
    body = renderAdmin();
  }

  app.innerHTML = topbar + body;
  bindEvents();
}

function renderLanding(){
  const visible = items.filter(i=>i.visible);
  let grid;
  if(visible.length === 0){
    grid = `
      <div class="empty">
        <p>Todavía no hay enlaces publicados.</p>
      </div>`;
  } else {
    grid = `<div class="grid">` + visible.map(it => `
      <a class="tile" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">
        <p class="tile-name">${esc(it.name)}</p>
      </a>
    `).join('') + `</div>`;
  }
  return `
    <div class="page-head"><h2>Enlaces del equipo</h2></div>
    ${grid}
    <div style="text-align:center;margin-top:40px;">
      <button class="lock-link" data-nav="admin">Administración</button>
    </div>`;
}

function renderAdmin(){
  if(!authChecked){
    return `
      <div class="page-head"><h2>Administración</h2></div>
      <div class="lock-panel"><p>Verificando sesión…</p></div>`;
  }
  if(!isAdmin){
    return `
      <div class="page-head"><h2>Administración</h2></div>
      <div class="lock-panel">
        <svg class="lock-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <p>El panel de administración requiere iniciar sesión.</p>
        <div class="login-form">
          <div>
            <label for="login-email">Correo</label>
            <input type="email" id="login-email" class="${loginError ? 'error' : ''}" placeholder="tu@correo.com" value="${esc(loginEmail)}" autocomplete="username">
          </div>
          <div>
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" class="${loginError ? 'error' : ''}" placeholder="••••••••" value="${esc(loginPassword)}" autocomplete="current-password">
          </div>
          <button class="btn btn-ink" id="login-submit" ${loginBusy ? 'disabled' : ''}>${loginBusy ? 'Ingresando…' : 'Iniciar sesión'}</button>
          ${loginError ? `<div class="login-error">${esc(loginError)}</div>` : ''}
        </div>
      </div>`;
  }

  const rows = items.length === 0
    ? `<div class="empty-row">No hay contenedores creados todavía.</div>`
    : items.map(it => `
      <div class="item-row">
        <div class="item-row-fields">
          <input type="text" class="item-name" value="${esc(it.name)}" data-field="name" data-id="${it.id}">
          <input type="url" class="item-url" value="${esc(it.url)}" data-field="url" data-id="${it.id}">
        </div>
        <div class="item-row-actions">
          <div class="vis-toggle">
            <label class="switch">
              <input type="checkbox" ${it.visible ? 'checked' : ''} data-toggle="${it.id}">
              <span class="slider"></span>
            </label>
            <span>Visible</span>
          </div>
          <button class="btn-text danger" data-del="${it.id}">Eliminar</button>
        </div>
      </div>
    `).join('');

  return `
    <div class="page-head">
      <h2>Administración</h2>
      <button class="lock-link" id="logout-btn">Cerrar sesión</button>
    </div>

    <div class="panel">
      <div class="panel-head">Contenedores existentes</div>
      ${rows}
      <div class="status-msg ${statusType}">${esc(statusMsg)}</div>
    </div>

    <div class="panel">
      <div class="panel-head">Agregar contenedor</div>
      <div class="add-form">
        <input type="text" placeholder="Nombre del contenedor" id="new-name" class="${addErrorFields.name ? 'field-error' : ''}" value="${esc(newRow.name)}">
        <input type="url" placeholder="https://ejemplo.com" id="new-url" class="${addErrorFields.url ? 'field-error' : ''}" value="${esc(newRow.url)}">
        <div class="add-form-footer">
          <span class="vis-hint">Se agrega visible por defecto</span>
          <button class="btn btn-ink" id="add-btn">Agregar</button>
        </div>
      </div>
      ${addError ? `<div class="status-msg err">${esc(addError)}</div>` : ''}
    </div>`;
}

function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> switchView(el.getAttribute('data-nav')));
  });

  document.querySelectorAll('input[data-field]').forEach(el=>{
    el.addEventListener('input', e=> updateField(el.getAttribute('data-id'), el.getAttribute('data-field'), e.target.value));
    el.addEventListener('blur', e=> commitField(el.getAttribute('data-id'), el.getAttribute('data-field'), e.target.value));
    el.addEventListener('keydown', e=>{ if(e.key === 'Enter') e.target.blur(); });
  });

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('change', ()=> toggleVisible(el.getAttribute('data-toggle')));
  });

  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', ()=> deleteItem(el.getAttribute('data-del')));
  });

  const nameInput = document.getElementById('new-name');
  const urlInput = document.getElementById('new-url');
  if(nameInput) nameInput.addEventListener('input', e=>{
    newRow.name = e.target.value;
    if(addErrorFields.name && e.target.value.trim()){ addErrorFields.name = false; e.target.classList.remove('field-error'); }
  });
  if(urlInput) urlInput.addEventListener('input', e=>{
    newRow.url = e.target.value;
    if(addErrorFields.url && e.target.value.trim()){ addErrorFields.url = false; e.target.classList.remove('field-error'); }
  });
  const addBtn = document.getElementById('add-btn');
  if(addBtn) addBtn.addEventListener('click', addItem);

  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', doLogout);

  const loginEmailInput = document.getElementById('login-email');
  const loginPasswordInput = document.getElementById('login-password');
  if(loginEmailInput) loginEmailInput.addEventListener('input', e=>{ loginEmail = e.target.value; });
  if(loginPasswordInput) loginPasswordInput.addEventListener('input', e=>{ loginPassword = e.target.value; });
  [loginEmailInput, loginPasswordInput].forEach(el=>{
    if(!el) return;
    el.addEventListener('keydown', e=>{ if(e.key === 'Enter') attemptLogin(); });
  });

  const loginSubmit = document.getElementById('login-submit');
  if(loginSubmit) loginSubmit.addEventListener('click', attemptLogin);
}

loadItems();
</script>
</body>
</html>
