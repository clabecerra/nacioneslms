name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar marca de versión en el footer
        run: |
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          sed -i "s/__BUILD_VERSION__/${STAMP} · ${SHORT_SHA}/" public/index.html
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NACIONES_LMS }}
          channelId: live
          projectId: naciones-lms
